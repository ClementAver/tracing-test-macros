[package]
name = "tracing-test-macros-macros"
version = "0.1.0"
edition = "2024"
authors = ["Clément Aver <clement.aver@yahoo.fr>"]
license = "MIT"
description = "Proc macros for tracing-test-macros"

[lib]
proc-macro = true

[dependencies.proc-macro2]
version = "1.0"
default-features = false
features = []

[dependencies.quote]
version = "1.0"
default-features = false
features = []

[dependencies.syn]
version = "2.0"
default-features = true
features = ["full"]

[dependencies.proc-macro-crate]
version = "3.5"
default-features = false
features = []