[package]
name = "test_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies.proc-macro2]
version = "1.0"
default-features = false
features = []

[dependencies.quote]
version = "1.0"
default-features = false
features = []

[dependencies.syn]
version = "2.0"
default-features = false
features = ["proc-macro"]

[dependencies.tokio]
version = "1.52"
default-features = false
features = ["net", "time", "macros", "rt", "rt-multi-thread", "signal"]